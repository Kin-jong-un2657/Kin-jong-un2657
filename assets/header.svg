<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 850 60'
    style='background-color: #0B1424;'
    width='850px' height='60px'>

    <style>
@font-face {
  font-family: 'Fira Code';
  font-style: normal;
  font-weight: 400;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                    <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s'
                    dur='3200ms' fill='remove'
                    values='m0,30 h0 ; m0,30 h850 ; m0,30 h850 ; m0,30 h0' keyTimes='0;0.5;0.875;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#7CD4E9' font-size='20'
        dominant-baseline='auto'
        x='0%' text-anchor='start'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            Ha Trung Kien | Information Security Student
        </textPath>
    </text>
        <path id='path1'>
                            <!-- Single line -->
                                <animate id='d1' attributeName='d' begin='d0.end'
                    dur='3200ms' fill='remove'
                    values='m0,30 h0 ; m0,30 h850 ; m0,30 h850 ; m0,30 h0' keyTimes='0;0.5;0.875;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#7CD4E9' font-size='20'
        dominant-baseline='auto'
        x='0%' text-anchor='start'
        letter-spacing='normal'>
        <textPath xlink:href='#path1'>
            FPT University | Full-Tuition Scholarship
        </textPath>
    </text>
        <path id='path2'>
                            <!-- Single line -->
                                <animate id='d2' attributeName='d' begin='d1.end'
                    dur='3200ms' fill='remove'
                    values='m0,30 h0 ; m0,30 h850 ; m0,30 h850 ; m0,30 h0' keyTimes='0;0.5;0.875;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#7CD4E9' font-size='20'
        dominant-baseline='auto'
        x='0%' text-anchor='start'
        letter-spacing='normal'>
        <textPath xlink:href='#path2'>
            Static PE Malware Analysis | ML Threat Detection
        </textPath>
    </text>
        <path id='path3'>
                            <!-- Single line -->
                                <animate id='d3' attributeName='d' begin='d2.end'
                    dur='3200ms' fill='freeze'
                    values='m0,30 h0 ; m0,30 h850 ; m0,30 h850 ; m0,30 h850' keyTimes='0;0.5;0.875;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#7CD4E9' font-size='20'
        dominant-baseline='auto'
        x='0%' text-anchor='start'
        letter-spacing='normal'>
        <textPath xlink:href='#path3'>
            Secure Backend Engineering
        </textPath>
    </text>
</svg>
